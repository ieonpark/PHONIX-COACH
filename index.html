// ─── SCORING ENGINE ──────────────────────────────────
function normW(w){return w.toLowerCase().replace(/[^a-z]/g,'');}
function lev(a,b){
  var m=a.length,n=b.length,dp=[];
  for(var i=0;i<=m;i++){dp[i]=[i];}
  for(var j=0;j<=n;j++){dp[0][j]=j;}
  for(var i=1;i<=m;i++)
    for(var j=1;j<=n;j++)
      dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function wMatch(said,tgt){
  if(said===tgt) return true;
  if(tgt.startsWith(said)||said.startsWith(tgt)) return true;
  return lev(said,tgt)<=(tgt.length<=4?1:2);
}

function analyze(transcript,targetSentence){
  if(!targetSentence||!targetSentence.trim()){
    var words=transcript.trim().split(/\s+/);
    var issues=[];
    words.forEach(function(w){
      var cl=normW(w);
      if(!cl||cl.length<3) return;
      if(TIPS[cl]&&issues.length<3)
        issues.push({word:cl,said:cl,issue:TIPS[cl].why,tip:TIPS[cl].tip});
    });
    var sc=Math.min(88,Math.max(50,78-issues.length*8));
    return {score:sc,issues:issues,wordDisplay:null,matched:0,total:0};
  }
  var said=transcript.trim().split(/\s+/).map(normW).filter(Boolean);
  var tgt=targetSentence.trim().split(/\s+/).map(normW).filter(Boolean);
  var results=[];
  var si=0;
  for(var ti=0;ti<tgt.length;ti++){
    var tw=tgt[ti];
    if(si<said.length&&wMatch(said[si],tw)){
      results.push({t:tw,s:said[si],ok:true});si++;
    } else if(si+1<said.length&&wMatch(said[si+1],tw)){
      results.push({t:tw,s:said[si+1],ok:true});si+=2;
    } else {
      results.push({t:tw,s:si<said.length?said[si]:null,ok:false});
      if(si<said.length) si++;
    }
  }
  var matched=results.filter(function(r){return r.ok;}).length;
  var total=tgt.length;
  var score=Math.min(97,Math.max(10,Math.round((matched/total)*100)));
  var issues=[];
  results.forEach(function(r){
    if(!r.ok&&issues.length<4){
      var tw=r.t;
      var kn=TIPS[tw];
      if(kn) issues.push({word:tw,said:r.s||"(빠짐)",issue:(r.s?'"'+r.s+'" 로 들렸어요 — ':'')+kn.why,tip:kn.tip});
      else if(r.s){
        var tip="";
        if(/^th/i.test(tw)) tip="혀를 이 사이에 살짝 대고 바람 (TH)";
        else if(/^r/i.test(tw)&&/^l/i.test(r.s||"")) tip="R: 혀를 어디에도 닿지 않게";
        else if(lev(tw,r.s||"")<=2) tip="거의 맞아요! 강세 위치를 확인해 보세요";
        else tip='"'+tw+'"를 천천히 발음해 보세요';
        issues.push({word:tw,said:r.s,issue:'"'+r.s+'" 로 들렸어요',tip:tip});
      } else {
        issues.push({word:tw,said:"(빠짐)",issue:"이 단어가 들리지 않았어요",tip:'"'+tw+'"를 명확하게 발음해 보세요'});
      }
    }
  });
  var wordDisplay=results.map(function(r){
    var col=r.ok?"#059669":"#DC2626";
    var bg=r.ok?"#ECFDF5":"#FEE2E2";
    return '<span style="display:inline-block;margin:2px 3px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;background:'+bg+';color:'+col+'">'+r.t+'</span>';
  }).join('');
  return {score:score,issues:issues,wordDisplay:wordDisplay,matched:matched,total:total};
}

var PHON_CACHE={};

function ipaConvert(s){
  return s
    // Diphthongs and long vowels — longest first
    .replace(/ɑː/g,'ah').replace(/ɔː/g,'aw').replace(/uː/g,'oo').replace(/iː/g,'ee').replace(/ɜː/g,'er')
    .replace(/eɪ/g,'ay').replace(/oʊ/g,'oh').replace(/əʊ/g,'oh').replace(/aɪ/g,'ai').replace(/aʊ/g,'ow').replace(/ɔɪ/g,'oy')
    .replace(/ɪər/g,'eer').replace(/ʊər/g,'oor').replace(/ɛər/g,'air').replace(/eər/g,'air')
    // Short vowels
    .replace(/ɒ/g,'ah').replace(/ɔ/g,'aw').replace(/ɑ/g,'ah')
    .replace(/æ/g,'a').replace(/ɪ/g,'i').replace(/ʊ/g,'oo')
    .replace(/ʌ/g,'uh').replace(/ɜ/g,'er').replace(/ɚ/g,'er').replace(/ər/g,'er').replace(/ə/g,'uh')
    .replace(/ɛ/g,'e').replace(/ɐ/g,'uh')
    // Affricates (must come before single-consonant replacements)
    .replace(/d͡ʒ/g,'j').replace(/t͡ʃ/g,'ch')  // with combining tie
    .replace(/d͡z/g,'j').replace(/t͡s/g,'ts')   // with combining tie
    .replace(/dʒ/g,'j').replace(/tʃ/g,'ch')    // without tie
    .replace(/dz/g,'dz')
    // Consonants
    .replace(/ɹ/g,'r')   // ← 영어 R (핵심 누락)
    .replace(/ɾ/g,'d')   // flap R (water, better의 t→d 소리)
    .replace(/ʃ/g,'sh').replace(/ʒ/g,'zh')
    .replace(/θ/g,'th').replace(/ð/g,'th')
    .replace(/ŋ/g,'ng').replace(/j/g,'y')
    .replace(/ʔ/g,'')    // glottal stop (삭제)
    .replace(/ʍ/g,'w').replace(/ɬ/g,'l').replace(/x/g,'k')
    .replace(/ʁ/g,'r').replace(/χ/g,'k')
    // Strip IPA marks + any remaining non-ASCII
    .replace(/[ˈˌːˑ()\[\]\/]/g,'')
    .replace(/[\u0080-\uFFFF]/g,''); // 변환 못한 IPA 기호 제거
}

  // Valid consonant onset clusters
  var ONSETS={'bl':1,'br':1,'ch':1,'cl':1,'cr':1,'dr':1,'dw':1,'fl':1,'fr':1,'gl':1,
    'gr':1,'pl':1,'pr':1,'sh':1,'sk':1,'sl':1,'sm':1,'sn':1,'sp':1,'st':1,'sw':1,
    'th':1,'tr':1,'tw':1,'wh':1,'spl':1,'spr':1,'str':1,'thr':1,'shr':1};
  function onsetLen(cons){
    for(var l=Math.min(3,cons.length);l>=2;l--) if(ONSETS[cons.slice(-l).toLowerCase()]) return l;
    return Math.min(1,cons.length);
  }
  var bounds=[0];
  for(var k=0;k<vPos.length-1;k++){
    var cStart=vPos[k].e, cEnd=vPos[k+1].s;
    var cons=p.slice(cStart,cEnd);
    bounds.push(cons.length===0?cStart:cEnd-onsetLen(cons));
  }
  var result=[];
  for(var k=0;k<bounds.length;k++){
    var start=bounds[k], end=k+1<bounds.length?bounds[k+1]:s.length;
    if(end>start) result.push(s.slice(start,end));
  }
  if(!result.length) return [s.toUpperCase()];
  result[0]=result[0].toUpperCase();
  return result;
}

function ipaToPhon(ipa){
  var s=(ipa||'').replace(/^[\/\[]|[\/\]]$/g,'').replace(/ˌ/g,'').trim();
  if(!s) return '';
  if(s.includes('.')){
    return s.split('.').map(function(syl){
      var st=syl.includes('ˈ');
      var c=ipaConvert(syl.replace(/ˈ/g,''));
      return st?c.toUpperCase():c;
    }).filter(Boolean).join('-');
  }
  var idx=s.indexOf('ˈ');
  if(idx<0) return splitPhonSyllables(ipaConvert(s)).join('-');
  var before=ipaConvert(s.slice(0,idx));
  var after=ipaConvert(s.slice(idx+1));
  // ˈ in middle: before is unstressed prefix, after is stressed+rest
  var afterSyls=splitPhonSyllables(after);
  return (before?before+'-':'')+afterSyls.join('-');
}

function fetchPhonForWords(words){
  var toFetch=words.filter(function(w){return w&&w.length>1&&!PH[w]&&PHON_CACHE[w]===undefined;});
  if(!toFetch.length) return Promise.resolve();
  var promises=toFetch.map(function(w){
    return fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w))
      .then(function(r){return r.ok?r.json():null;})
      .then(function(data){
        if(data&&data[0]&&data[0].phonetics){
          var ph=data[0].phonetics.find(function(p){return p.text&&p.text.length>2;});
          var result=ph?ipaToPhon(ph.text):'';
          PHON_CACHE[w]=result||phonetize(w);
        } else {
          PHON_CACHE[w]=phonetize(w);
        }
      })
      .catch(function(){PHON_CACHE[w]=phonetize(w);});
  });
  return Promise.all(promises);
}

function phonetize(w){
  if(!w) return '';
  var lower=w.toLowerCase();
  if(_PHON_EXCEPTIONS[lower]) return _PHON_EXCEPTIONS[lower];
  var p=lower;
  // Word-end suffix patterns — before general rules
  p=p.replace(/ations$/, 'ayshunz').replace(/ation$/, 'ayshun');
  p=p.replace(/iences$/, 'ee-untsiz').replace(/ience$/, 'ee-unts');
  p=p.replace(/encies$/, 'un-seez').replace(/ency$/, 'un-see');
  p=p.replace(/ancies$/, 'un-seez').replace(/ancy$/, 'un-see');
  p=p.replace(/ities$/, 'ih-teez').replace(/ity$/, 'ih-tee');
  p=p.replace(/aries$/, 'air-eez').replace(/ary$/, 'air-ee');
  p=p.replace(/ories$/, 'or-eez').replace(/ory$/, 'or-ee');
  p=p.replace(/eries$/, 'er-eez').replace(/ery$/, 'er-ee');
  p=p.replace(/ifies$/, 'ih-fyz').replace(/ify$/, 'ih-fy');
  p=p.replace(/ively$/, 'iv-lee').replace(/ivity$/, 'IV-ih-tee');
  p=p.replace(/ments$/, 'munts').replace(/ment$/, 'munt');
  p=p.replace(/nesses$/, 'nes-iz').replace(/ness$/, 'nes');
  p=p.replace(/lessly$/, 'les-lee').replace(/lessly$/, 'les-lee');
  p=p.replace(/fully$/, 'ful-ee').replace(/ful$/, 'ful');
  p=p.replace(/ings$/, 'ingz').replace(/ing$/, 'ing');
  p=p.replace(/ers$/, 'erz').replace(/er$/, 'er');
  p=p.replace(/ors$/, 'erz').replace(/or$/, 'er');
  // Multi-char patterns — longest first
  p=p.replace(/tion/g,'shun').replace(/sion/g,'zhun').replace(/ture/g,'cher');
  p=p.replace(/eigh/g,'ay').replace(/ight/g,'ayt').replace(/igh/g,'eye');
  p=p.replace(/aught/g,'awt').replace(/ought/g,'awt').replace(/ough/g,'oh');
  // Vowel digraphs
  p=p.replace(/oo/g,'oo').replace(/ee/g,'ee').replace(/ea/g,'ee');
  p=p.replace(/ai/g,'ay').replace(/ay/g,'ay');
  p=p.replace(/oa/g,'oh').replace(/oe/g,'oh');
  p=p.replace(/oi/g,'oy').replace(/oy/g,'oy');
  p=p.replace(/ew/g,'yoo').replace(/aw/g,'aw').replace(/au/g,'aw');
  p=p.replace(/ue/g,'oo').replace(/ui/g,'oo');
  p=p.replace(/ie/g,'ee').replace(/ei/g,'ay');
  // ow: word-final or before consonant → oh (know, show); before vowel → ow (power)
  p=p.replace(/own\b/g,'ohn').replace(/ow([bcdfghjklmnpqrstvwxyz]{2})/g,'ow$1');
  p=p.replace(/ow$/g,'oh').replace(/ow(?=[^aeiou])/g,'oh').replace(/ow/g,'ow');
  p=p.replace(/ou/g,'ow');  // found, sound, out → ow
  // Consonant patterns
  p=p.replace(/tch/g,'ch').replace(/ck/g,'k').replace(/ph/g,'f');
  p=p.replace(/gh/g,'').replace(/kn/g,'n').replace(/wr/g,'r');
  p=p.replace(/qu/g,'kw').replace(/wh/g,'w').replace(/mb$/g,'m');
  p=p.replace(/c([eiy])/g,'s$1').replace(/c/g,'k');
  p=p.replace(/g([ei])/g,'j$1').replace(/x/g,'ks');
  // Silent final e
  if(p.length>2&&/[^aeiouy]e$/.test(p)) p=p.slice(0,-1);
  // Final -s → z after vowel/voiced
  p=p.replace(/([aeiooulmnr])s$/g,'$1z');
  // Map remaining bare vowels to clearer sounds
  p=p.replace(/\boh\b/g,'oh');
  return splitPhonSyllables(p).join('-');
}

function getRhythmHints(words){
  var lw=words.map(function(w){return w.toLowerCase().replace(/[^a-z']/g,'');});
  // Content word = stressed (not a function word)
  var stressed=lw.map(function(w,i){
    return !!w&&!FUNC_SET[w]&&!(w.length<=1);

  // Linking: final consonant + initial vowel of next word
  var linking=[];
  for(var i=0;i<lw.length-1;i++){
    var a=lw[i].replace(/'/g,''), b=lw[i+1].replace(/'/g,'');
    if(!a||!b) continue;

  }
  // Common reductions
  var reds=[];
  for(var i=0;i<lw.length;i++){
    for(var r=0;r<REDUCTIONS.length;r++){
      var m=REDUCTIONS[r].m, ok=true;
      for(var j=0;j<m.length;j++){if((lw[i+j]||'').replace(/'/g,'')!==m[j]){ok=false;break;}}
      if(ok) reds.push({at:i,len:m.length,result:REDUCTIONS[r].r});
    }
  }
  return {stressed:stressed,linking:linking,reductions:reds};
}

function wordByWordHTML(eng,phon){
  var words=eng.trim().split(/\s+/);
  var chunks=phon?phon.split('-'):[];

  function norm(w){return w.toLowerCase().replace(/[^a-z]/g,'');}

  // Count syllables by vowel groups
  function sylCount(word){
    var w=norm(word);
    if(!w) return 1;
    var n=0,inV=false,prev='';
    // These adjacent vowel pairs almost always represent 2 separate syllables in English
    var SPLIT={'ia':1,'ua':1,'iu':1,'uo':1,'ae':1,'oe':1};
    for(var i=0;i<w.length;i++){
      var ch=w[i];
      var isV='aeiou'.indexOf(ch)>=0||(ch==='y'&&i>0&&i===w.length-1);
      if(isV&&!inV){n++;inV=true;}
      else if(isV&&inV&&SPLIT[prev+ch]){n++;}  // split pair = new syllable
      else if(!isV){inV=false;}
      prev=ch;
    }
    if(w.length>2&&w[w.length-1]==='e'&&'aeiou'.indexOf(w[w.length-2])<0&&n>1) n--;
    return Math.max(1,n);
  }

  // Check if a phon chunk likely corresponds to a word (first-letter matching)
  function chunkMatchesWord(chunk,word){
    var c=chunk.toLowerCase().replace(/[^a-z]/g,'');
    var w=norm(word);
    if(!c||!w) return false;
    var c0=c[0], w0=w[0];
    if(c0===w0) return true;
    if('aeiou'.indexOf(c0)>=0 && 'aeiou'.indexOf(w0)>=0) return true;
    if((c0==='k'&&w0==='c')||(c0==='c'&&w0==='k')) return true;
    if((c0==='j'&&(w0==='y'||w0==='j'))||(c0==='y'&&w0==='j')) return true;
    if(c0==='f'&&w0==='p'&&w[1]==='h') return true;
    return false;
  }

  var wordPhons=new Array(words.length).fill('');
  var ci=0;

  // Process ALL words uniformly: try chunk match first, then PH dict, then rules
  words.forEach(function(word,wi){
    var k=norm(word);
    if(ci<chunks.length && chunkMatchesWord(chunks[ci],word)){
      var sc=sylCount(word);
      var group=chunks.slice(ci,Math.min(ci+sc,chunks.length));
      wordPhons[wi]=group.join('-');
      ci+=group.length;
    } else {
      var ph=wordPhon(k);
      if(ph){
        wordPhons[wi]=ph;
      } else {
        wordPhons[wi]=phonetize(k);
      }
    }
  });

  // ── Render stressed syllable helper ──
  function sylHTML(syl,showDot){
    var st=/[A-Z]{2,}/.test(syl);
    var dot=showDot?'<span style="color:#bbb;font-size:13px"> · </span>':'';
    var txt=syl.toLowerCase();
    return dot+(st
      ?'<b style="color:#111;font-size:14px;font-family:monospace;letter-spacing:0.3px">'+txt+'</b>'
      :'<span style="color:#777;font-size:13px;font-family:monospace;letter-spacing:0.3px">'+txt+'</span>');
  }

  function phHTML(ph){
    return ph.split('-').map(function(s,j){return sylHTML(s,j>0);}).join('');
  }

  // ── Rhythm / linking ──
  var rh=getRhythmHints(words);
  var linkSet={};
  rh.linking.forEach(function(li){linkSet[li]=true;});

  // ── Full sentence pronunciation bar — words stay separate, arc shows linking ──
  var html='<div style="background:#f8f8f8;border-radius:10px;padding:10px 14px;margin-bottom:14px">'
    +'<div style="font-size:9px;color:#aaa;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px">전체 문장 발음</div>'
    +'<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;line-height:2.4">';
  wordPhons.forEach(function(ph,i){
    if(!ph) return;
    html+='<span>'+phHTML(ph)+'</span>';
    if(linkSet[i]&&wordPhons[i+1]){
      html+='<span style="color:#FF6B35;font-size:11px;font-weight:700;line-height:1;margin:0 -3px;position:relative;top:-2px">⌒</span>';
    }
  });
  html+='</div></div>';

  // ── Word cards ──
  html+='<div style="display:flex;flex-wrap:wrap;gap:4px 14px;">';
  words.forEach(function(word,i){
    var ph=wordPhons[i]||'';
    var hasStress=ph&&/[A-Z]{2,}/.test(ph);
    html+='<div style="display:inline-flex;flex-direction:column;align-items:center;gap:1px;margin-bottom:8px;">'
      +'<span style="font-size:15px;font-weight:'+(hasStress?'800':'500')+';color:'+(hasStress?'#111':'#444')+'">'
      +word+(linkSet[i]?'<span style="font-size:8px;color:#FF6B35;vertical-align:super">⌒</span>':'')
      +'</span>'
      +(ph
        ?'<div style="background:#f0f0f0;border-radius:5px;padding:2px 7px;white-space:nowrap;line-height:1.6">'+phHTML(ph)+'</div>'
        :'<div style="height:20px;"></div>')
      +'</div>';
  });
  html+='</div>';

  // ── Connected speech / reduction hints ──
  var hints=[];
  rh.reductions.forEach(function(red){
    var orig=words.slice(red.at,red.at+red.len).join(' ');
    hints.push('"'+orig+'" → <b>'+red.result+'</b> 로 줄여 발음해요');
  });
  if(rh.linking.length){
    var linkEx=rh.linking.slice(0,3).map(function(li){
      return '"<b>'+words[li]+'</b> '+words[li+1]+'" → 이어서 발음해요';
    }).join('  ');
    hints.push(linkEx);
  }
  if(hints.length){
    html+='<div style="font-size:11px;color:#555;margin-top:0;margin-bottom:4px;background:#f8f8f8;border-radius:7px;padding:7px 12px;line-height:2;border-left:3px solid #FF6B35">'
      +hints.join('<br>')+'</div>';
  }

  return html;
}

// Simplified furigana-style phonetics for music karaoke (no monospace, no stress chart)
function musicWordPhon(eng){
  if(!eng) return '';
  var words=eng.trim().split(/\s+/);
  // Detect linking pairs
  var lw=words.map(function(w){return w.toLowerCase().replace(/[^a-z]/g,'');});
  var musicLinkSet={};
  for(var li=0;li<lw.length-1;li++){
    var la=lw[li],lb=lw[li+1];
    if(la&&lb&&'bcdfghjklmnpqrstvwxyz'.indexOf(la[la.length-1])>=0&&'aeiou'.indexOf(lb[0])>=0)
      musicLinkSet[li]=true;
  }
  function musicGetLinkCons(ph){
    var lastSyl=ph.split('-').pop().toLowerCase();
    var VNUC=['eer','oor','air','eye','ai','aw','ay','ee','oo','oy','ow','uh','er','oh','aa','ah'];
    var lastNucEnd=-1,i=0;
    while(i<lastSyl.length){
      var found=false;
      for(var n=0;n<VNUC.length;n++){
        var nl=VNUC[n].length;
        if(lastSyl.slice(i,i+nl)===VNUC[n]){lastNucEnd=i+nl;i+=nl;found=true;break;}
      }
      if(!found){if('aeiou'.indexOf(lastSyl[i])>=0) lastNucEnd=i+1; i++;}
    }
    if(lastNucEnd<0||lastNucEnd>=lastSyl.length) return '';
    var trail=lastSyl.slice(lastNucEnd);
    var DIGRAPHS=['ng','sh','th','ch','zh'];
    for(var d=0;d<DIGRAPHS.length;d++) if(trail.endsWith(DIGRAPHS[d])) return DIGRAPHS[d];
    return trail.slice(-1);
  }

  var html='<div style="display:flex;flex-wrap:wrap;gap:10px 16px;padding:4px 0">';
  words.forEach(function(word,wi){
    var k=word.toLowerCase().replace(/[^a-z]/g,'');
    if(!k) return;
    var ph=wordPhon(k)||phonetize(k)||k.toUpperCase();
    var hasStress=/[A-Z]{2,}/.test(ph);
    var isFunc=!!FUNC_SET[k];
    var lc=musicLinkSet[wi]?musicGetLinkCons(ph):'';
    var phBase=lc?ph.slice(0,ph.length-lc.length):ph;
    var phTxt=phBase.replace(/-/g,'·')+(lc?'<span style="color:#FF6B35;font-weight:800;font-size:9px">'+lc+'⌒</span>':'');
    html+='<div style="display:flex;flex-direction:column;align-items:center;gap:1px">'
      +'<span style="font-size:10px;letter-spacing:.5px;color:'+(isFunc?'#ccc':(hasStress?'#FF6B35':'#999'))+';font-weight:'+(hasStress?'700':'400')+'">'+phTxt+'</span>'
      +'<span style="font-size:14px;font-weight:'+(hasStress?'700':'400')+';color:'+(isFunc?'#bbb':'#1a1a1a')+'">'+word+'</span>'
      +'</div>';
  });
  html+='</div>';
  return html;
}

function _todayKey(){return new Date().toISOString().slice(0,10);}
function getDailyGoal(){return Math.max(1,parseInt(localStorage.getItem('phonix_goal')||'5'));}
function setDailyGoal(n){localStorage.setItem('phonix_goal',String(Math.max(1,Math.min(50,n))));render();}
function getDailyStats(){
  try{
    var goal=getDailyGoal();
    var d=JSON.parse(localStorage.getItem('phonix_daily')||'{}');
    var today=_todayKey();
    if(d.date!==today){
      var prev=new Date();prev.setDate(prev.getDate()-1);
      var prevKey=prev.toISOString().slice(0,10);
      var streak=(d.date===prevKey&&(d.count||0)>=goal)?(d.streak||0)+1:0;
      d={date:today,count:0,streak:streak};
      localStorage.setItem('phonix_daily',JSON.stringify(d));
    }
    return d;
  }catch(e){return{date:_todayKey(),count:0,streak:0};}
}
function markDailyStudy(result){
  var d=getDailyStats();
  d.count=(d.count||0)+1;
  localStorage.setItem('phonix_daily',JSON.stringify(d));
  if(result&&result.issues){
    var w=_getWeakMap();
    result.issues.forEach(function(iss){
      if(iss.word) w[iss.word]=(w[iss.word]||0)+1;
      // track phoneme category
      var word=iss.word||'';
      if(/^th/i.test(word)) w['__th']=(w['__th']||0)+1;
      else if(/^r/i.test(word)) w['__r']=(w['__r']||0)+1;
      else if(/^l/i.test(word)) w['__l']=(w['__l']||0)+1;
      else if(/^[vb]/i.test(word)) w['__vb']=(w['__vb']||0)+1;
      else if(/^[fp]/i.test(word)) w['__fp']=(w['__fp']||0)+1;
      else if(/wh/i.test(word)) w['__wh']=(w['__wh']||0)+1;
    });
    localStorage.setItem('phonix_weak',JSON.stringify(w));
  }
}
function _getWeakMap(){try{return JSON.parse(localStorage.getItem('phonix_weak')||'{}');}catch(e){return{};}}
function getWeakAnalysis(){
  var w=_getWeakMap();
  var total=Object.keys(w).filter(function(k){return k.indexOf('__')<0;}).reduce(function(s,k){return s+w[k];},0);
  if(total<3) return null; // 데이터 부족
  var cats=[
    {key:'__th',label:'TH 발음',tip:'혀를 이 사이에 살짝 대고 바람을 불어요 (think→씽크 ✕, 씬크 ✓)'},
    {key:'__r', label:'R 발음',tip:'혀가 어디에도 닿지 않게 — 입안에서 공중에 떠 있어야 해요'},
    {key:'__l', label:'L 발음',tip:'혀끝을 윗니 바로 뒤 잇몸에 탁 붙였다 떼세요'},
    {key:'__vb',label:'V / B 구분',tip:'V는 윗니로 아랫입술을 살짝 물고 진동, B는 두 입술을 붙였다 터뜨려요'},
    {key:'__fp',label:'F / P 구분',tip:'F는 윗니-아랫입술 마찰음, P는 두 입술 파열음이에요'},
    {key:'__wh',label:'WH 발음',tip:'"wh-" 단어는 보통 W 소리만 나요 (what→왓, where→웨어)'}
  ];
  var scored=cats.filter(function(c){return w[c.key]>0;}).sort(function(a,b){return (w[b.key]||0)-(w[a.key]||0);});
  // top word
  var wordItems=Object.keys(w).filter(function(k){return k.indexOf('__')<0;}).map(function(k){return{word:k,cnt:w[k]};});
  wordItems.sort(function(a,b){return b.cnt-a.cnt;});
  var top3=wordItems.slice(0,3);
  return {cats:scored.slice(0,2),words:top3,total:total};
}

function errFor(code){
  return {
    'not-allowed':'주소창 🔒 → 마이크 허용 후 다시 시도해 주세요',
    'permission-denied':'주소창 🔒 → 마이크 허용 후 다시 시도해 주세요',
    'no-speech':'음성이 감지되지 않았어요. 더 크게 말해보세요',
    'network':'네트워크 오류입니다',
    'audio-capture':'마이크가 감지되지 않습니다'
  }[code]||'오류: '+code;
}

function startMic(onInterim,onFinal,onErr){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){onErr('Chrome 또는 Edge 브라우저를 사용해 주세요');return null;}
  
  var finalText='',interimText='';
  var silTimer=null,stopped=false,r=null;
  
  function clearSil(){clearTimeout(silTimer);silTimer=null;}
  function stop(){
    if(stopped) return; stopped=true; clearSil();
    try{r.abort();}catch(e){}
    var t=(finalText+' '+interimText).trim();
    if(t) onFinal(t);
  }
  function setSil(){
    clearSil();
    if(finalText.trim()) silTimer=setTimeout(stop,4000);
  }
  
  function mkR(){
    var nr=new SR();
    nr.lang='en-US'; nr.interimResults=true;
    nr.continuous=false; // false = more stable on Android
    nr.maxAlternatives=1;
    nr.onresult=function(e){
      if(stopped) return;
      var fin='',itr='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        var t=e.results[i][0].transcript;
        if(e.results[i].isFinal) fin+=t+' '; else itr=t;
      }
      if(fin) finalText+=fin;
      interimText=itr;
      onInterim((finalText+interimText).trim());
      setSil();
    };
    nr.onerror=function(e){
      if(stopped) return;
      if(e.error==='no-speech'||e.error==='aborted') return;
      stopped=true; clearSil(); onErr(errFor(e.error));
    };
    nr.onend=function(){
      if(stopped) return;
      // Restart to keep recording (simulates continuous mode)
      try{r=mkR();r.start();}catch(ex){
        // Browser blocked restart — use silence timer
        setSil();
      }
    };
    return nr;
  }
  
  r=mkR();
  try{r.start();}catch(e){onErr('마이크를 시작할 수 없습니다');return null;}
  return {stop:stop};
}

function stopMic(ref){if(ref){try{ref.stop();}catch(e){}}return null;}

var _ttsAudio=null;  // track current Audio element so stopAll() can cancel it

function speakEng(txt){
  if(!txt) return;
  txt=txt.trim();
  if(!txt) return;

  // Stop anything playing
  if(_ttsAudio){try{_ttsAudio.pause();}catch(e){}_ttsAudio=null;}

  S.speaking=true; render();
  function onDone(){S.speaking=false;_ttsAudio=null;render();}

  // Primary: Google Translate TTS — neural quality, no API key required
  // <audio> elements are not subject to CORS restrictions for playback
  var q=encodeURIComponent(txt.substring(0,200));
  var url='https://translate.google.com/translate_tts?ie=UTF-8&q='+q+'&tl=en-US&client=tw-ob&ttsspeed=0.87';
  _ttsAudio=new Audio(url);
  _ttsAudio.onended=onDone;
  _ttsAudio.onerror=function(){_ttsAudio=null;_speakWebAPI(txt,onDone);};

  if(p&&p.catch) p.catch(function(){if(_ttsAudio){_ttsAudio=null;_speakWebAPI(txt,onDone);}});
}

// Fallback: Web Speech API (device-bundled voices)
function _speakWebAPI(txt,onDone){
  if(!window.speechSynthesis){if(onDone)onDone();return;}
  speechSynthesis.cancel();

  function doSpeak(){
    var voices=speechSynthesis.getVoices();
    // Priority: Microsoft Neural (Chrome/Edge on Windows) > iOS Siri > Google > legacy
    var PREF=[
      'Microsoft Aria Online (Natural) - English (United States)',
      'Microsoft Jenny Online (Natural) - English (United States)',
      'Microsoft Andrew Online (Natural) - English (United States)',
      'Microsoft Eric Online (Natural) - English (United States)',
      'Microsoft Ana Online (Natural) - English (United States)',
      'Microsoft Emma Online (Natural) - English (United States)',
      'Microsoft Brian Online (Natural) - English (United States)',
      'Microsoft Christopher Online (Natural) - English (United States)',
      'Microsoft Guy Online (Natural) - English (United States)',
      'Microsoft Roger Online (Natural) - English (United States)',
      'com.apple.ttsbundle.Samantha-premium',
      'com.apple.voice.enhanced.en-US.Nicky',
      'com.apple.ttsbundle.Daniel-premium',
      'Samantha','Aaron','Nicky','Martha','Alex',
      'Google US English',
      'Microsoft Zira','Microsoft David','Microsoft Mark',
      'Karen','Daniel','Moira','Rishi'
    ];
    var v=null;
    for(var i=0;i<PREF.length&&!v;i++)
      for(var j=0;j<voices.length;j++)
        if(voices[j].name===PREF[i]){v=voices[j];break;}
    if(!v) for(var j=0;j<voices.length;j++){
      var vn=voices[j].name.toLowerCase(),vl=voices[j].lang;
      if(vl==='en-US'&&(vn.indexOf('natural')>=0||vn.indexOf('neural')>=0||vn.indexOf('premium')>=0||vn.indexOf('enhanced')>=0)){v=voices[j];break;}
    }
    if(!v) for(var j=0;j<voices.length;j++) if(voices[j].lang==='en-US'&&voices[j].localService){v=voices[j];break;}
    if(!v) for(var j=0;j<voices.length;j++) if(voices[j].lang==='en-US'){v=voices[j];break;}
    if(!v) for(var j=0;j<voices.length;j++) if(voices[j].lang.startsWith('en')){v=voices[j];break;}

    var u=new SpeechSynthesisUtterance(txt);
    if(v) u.voice=v;
    u.lang='en-US';
    var wc=txt.trim().split(/\s+/).length;
    u.rate=wc<=5?0.88:wc<=9?0.90:0.93;
    u.pitch=txt.trim().endsWith('?')?1.05:txt.trim().endsWith('!')?1.02:1.0;
    u.volume=1;
    u.onstart=function(){S.speaking=true;render();};
    u.onend=function(){if(onDone)onDone();};
    u.onerror=function(){if(onDone)onDone();};
    speechSynthesis.speak(u);
    if(speechSynthesis.paused) speechSynthesis.resume();
  }

  var voices=speechSynthesis.getVoices();
  if(voices.length>0){
    setTimeout(doSpeak,80);
  } else {
    var tries=0;
    var poll=setInterval(function(){
      if(speechSynthesis.getVoices().length>0||tries>10){
        clearInterval(poll);
        setTimeout(doSpeak,80);
      }
      tries++;
    },200);
  }
}

        +'<div style="font-size:11px;color:#555;margin-bottom:3px">'+iss.issue+'</div>'

    issH='<div style="background:#fff;border-radius:12px;padding:13px;margin-bottom:10px;box-shadow:0 1px 8px rgba(0,0,0,.05)">'+rows+'</div>';
  } else {
    issH='<div style="background:#ECFDF5;border-radius:12px;padding:10px;font-size:12px;color:#059669;font-weight:600;text-align:center;margin-bottom:10px">모든 단어가 정확하게 들렸어요 🎉</div>';
  }
  var bar='<div style="background:#fff;border-radius:12px;padding:11px 14px;box-shadow:0 1px 8px rgba(0,0,0,.05)">'
    +'<div style="display:flex;align-items:center;gap:10px">'
    +'<span style="font-size:11px;color:#999">정확도</span>'
    +'<div style="flex:1;height:7px;background:#f3f4f6;border-radius:4px;overflow:hidden">'
    +'<div style="height:100%;width:'+sc+'%;background:'+col+';border-radius:4px;transition:width .9s ease"></div></div>'
    +'<span style="font-weight:800;font-size:16px;color:'+col+';min-width:40px">'+sc+'%</span></div></div>';
  return wd+issH+bar;
}

function _editDist(a,b){
  var m=a.length,n=b.length,dp=[],i,j;
  for(i=0;i<=m;i++){dp[i]=[i];}
  for(j=0;j<=n;j++){dp[0][j]=j;}
  for(i=1;i<=m;i++){for(j=1;j<=n;j++){dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);}}
  return dp[m][n];
}

function _openPronInput(idx,engText){
  var re=document.getElementById('pron-result-'+idx);
  if(!re) return;
  re.style.display='block';
  var safeEng=engText.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  re.innerHTML='<div style="font-size:10px;color:#aaa;margin-bottom:6px">발음한 대로 입력하세요</div>'
    +'<div style="display:flex;gap:6px">'

    +'onkeydown="if(event.key===\'Enter\')_checkPronInput('+idx+',\''+safeEng+'\')" />'
    +'<button onclick="_checkPronInput('+idx+',\''+safeEng+'\')" '
    +'style="background:#1a1a1a;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer">확인</button>'
    +'</div>';
  setTimeout(function(){var el=document.getElementById('pron-input-'+idx);if(el)el.focus();},50);
}

function _checkPronInput(idx,target){
  var inputEl=document.getElementById('pron-input-'+idx);
  if(!inputEl) return;
  var typed=inputEl.value.trim();
  if(!typed) return;
  function normW(w){return w.toLowerCase().replace(/[^a-z']/g,'');}
  var sw=typed.split(/\s+/).map(normW).filter(Boolean);
  var tw=target.trim().split(/\s+/).map(normW).filter(Boolean);
  var mistakes=[];
  var parts=tw.map(function(t,i){
    var s=sw[i]||'';
    if(!s){mistakes.push({e:t,s:'(없음)'});return '<span style="color:#e74c3c;font-weight:700;background:#fee2e2;border-radius:3px;padding:1px 5px">'+t+'</span>';}
    if(s===t) return '<span style="color:#16a34a;font-weight:600">'+t+'</span>';
    var d=_editDist(s,t);
    var thresh=Math.max(1,Math.floor(t.length/4));
    mistakes.push({e:t,s:s});
    return '<span style="color:'+(d<=thresh?'#ea580c':'#e74c3c')+';font-weight:700;background:'+(d<=thresh?'#fff7ed':'#fee2e2')+';border-radius:3px;padding:1px 5px">'+t+'</span>';
  }).join(' ');
  var mHtml=mistakes.length===0
    ?'<div style="color:#16a34a;font-size:11px;margin-top:6px;font-weight:600">✓ 완벽해요!</div>'
    :'<div style="margin-top:7px">'+mistakes.map(function(m){
      return '<div style="font-size:11px;color:#e74c3c;line-height:1.8"><b>'+m.e+'</b> → <span style="color:#888">"'+m.s+'"</span> 라고 발음했어요</div>';
    }).join('')+'</div>';
  var safeEng=target.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  var re=document.getElementById('pron-result-'+idx);
  if(re){
    re.innerHTML='<div style="font-size:13px;line-height:2.4;margin-bottom:2px">'+parts+'</div>'
      +mHtml
      +'<button onclick="_openPronInput('+idx+',\''+safeEng+'\')" style="margin-top:8px;background:#f0f0f0;border:none;border-radius:7px;padding:5px 12px;font-size:11px;cursor:pointer;color:#555">다시 시도</button>';
  }
}

function _rebuildSongPicker(){

var _musicAudio=null;
var _spotifyApi=null;
var _spotifyController=null;
var _currentPos=0;
var _previewStartPos=null;
var _lastLyricIdx=-1;
var _timingOffset=0;
var _looping=false;
var _scWidget=null;
window.onSpotifyIframeApiReady=function(IFrameAPI){
  _spotifyApi=IFrameAPI;
  if(S.screen==='music') _initSpotifyPlayer();
};

function _calTap(i){
  var relPos=_previewStartPos!==null?_currentPos-_previewStartPos:_currentPos;
  var t=Math.max(0,relPos-0.15);
  var song=MUSIC_DATA[S.musicSongIdx||0];
  if(song.lyrics[i]) song.lyrics[i].t=t;
  var btn=document.getElementById('cal-'+i);
  if(btn){btn.textContent=t.toFixed(1)+'s ✓';btn.style.color='#22c55e';btn.style.borderColor='#22c55e';}
}

function _setLyricDisplay(idx,byUser){
  if(idx<0) return;
  if(byUser) _userLyricClick=Date.now();
  _lastLyricIdx=idx;
  var cards=document.querySelectorAll('.lyric-card');
  for(var i=0;i<cards.length;i++){
    var card=cards[i];
    var textEl=card.querySelector('.lc-text');
    var phonEl=card.querySelector('.lc-phon');
    var ttsBtn=card.querySelector('.lc-tts');
    var hls=card.querySelectorAll('.lyric-hl');
    if(i===idx){
      if(_musicOpenAll){
        // Single-box mode: subtle row highlight
        card.style.background='rgba(0,0,0,0.05)';
        if(textEl){textEl.style.color='#1a1a1a';textEl.style.fontWeight='600';}
        if(ttsBtn){ttsBtn.style.background='#e0e0e0';ttsBtn.style.color='#333';}
      } else {
        // Card mode: dark card
        card.style.background='#1a1a1a';
        card.style.borderColor='#333';
        if(textEl){textEl.style.color='#fff';textEl.style.fontWeight='600';}
        if(ttsBtn){ttsBtn.style.background='rgba(255,255,255,.15)';ttsBtn.style.color='#fff';}
        for(var k=0;k<hls.length;k++){hls[k].style.background='#FF6B35';hls[k].style.color='#fff';}
        if(phonEl) phonEl.style.display='block';
      }
      card.scrollIntoView({behavior:'smooth',block:'nearest'});
    }else{
      if(_musicOpenAll){
        card.style.background='transparent';
        if(textEl){textEl.style.color='#aaa';textEl.style.fontWeight='400';}
        if(ttsBtn){ttsBtn.style.background='#f0f0f0';ttsBtn.style.color='#555';}
      } else {
        card.style.background='#fff';
        card.style.borderColor='#ebebeb';
        if(textEl){textEl.style.color='#888';textEl.style.fontWeight='600';}
        if(ttsBtn){ttsBtn.style.background='#f0f0f0';ttsBtn.style.color='#555';}
        for(var k=0;k<hls.length;k++){hls[k].style.background='#ddd';hls[k].style.color='#888';}
        if(phonEl) phonEl.style.display='none';
      }
    }
  }
}
function _applyOpenAllMode(){
  var btn=document.getElementById('open-all-btn');
  if(btn){
    btn.textContent=_musicOpenAll?'부분 열기':'전체 열기';
    btn.style.background=_musicOpenAll?'#1a1a1a':'#f0f0f0';
    btn.style.color=_musicOpenAll?'#fff':'#555';
  }

  if(cont){
    cont.innerHTML=_musicOpenAll?(window._lyricHtmlOpen||''):(window._lyricHtmlPartial||'');

function goMusic(tab){
  stopAll();
  _previewStartPos=null;
  _lastLyricIdx=-1;
  _timingOffset=0;
  _musicOpenAll=false;
  _calIdx=0;_calTimes=[];
  _musicTab=(tab!==undefined)?tab:1;
  _musicPage=0;
  if(_spotifyController){try{_spotifyController.destroy();}catch(e){}_spotifyController=null;}
  if(_musicAudio){try{_musicAudio.pause();}catch(e){}_musicAudio=null;}
  set({screen:'music',musicPlaying:false,musicLoading:false,musicPreviewUrl:''});
}

function _initSoundCloudPlayer(container,song){
  if(_scWidget){try{_scWidget.pause();}catch(e){}_scWidget=null;}
  _previewStartPos=0;
  var enc=encodeURIComponent(song.soundcloudUrl);
  var src='https://w.soundcloud.com/player/?url='+enc+'&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false';
  container.innerHTML='<iframe id="sc-iframe" width="100%" height="120" scrolling="no" frameborder="no" allow="autoplay" src="'+src+'"></iframe>';
  setTimeout(function(){
    var iframe=document.getElementById('sc-iframe');
    if(!iframe||!window.SC) return;
    _scWidget=SC.Widget(iframe);
    _scWidget.bind(SC.Widget.Events.PLAY_PROGRESS,function(e){
      if(e&&typeof e.currentPosition==='number') _updateLyricHighlight(e.currentPosition/1000);
    });
  },600);
}

function _initSpotifyPlayer(){
  var container=document.getElementById('music-player-container');
  if(!container) return;
  var song=MUSIC_DATA[S.musicSongIdx||0];
  if(song.soundcloudUrl){_initSoundCloudPlayer(container,song);return;}
  if(!_spotifyApi) return;
  if(_spotifyController){try{_spotifyController.destroy();}catch(e){}_spotifyController=null;}
  var opts={uri:'spotify:track:'+song.spotifyId,width:'100%',height:80};
  _spotifyApi.createController(container,opts,function(ctrl){
    _spotifyController=ctrl;
    ctrl.addListener('playback_update',function(e){
      if(!e.data) return;
      if(typeof e.data.position==='number') _updateLyricHighlight(e.data.position/1000);
      if(e.data.isPaused&&_previewStartPos!==null&&!_looping){
        var relPos=(e.data.position/1000)-_previewStartPos;
        if(relPos>25){
          _looping=true;
          _lastLyricIdx=-1;
          _setLyricDisplay(0);
          setTimeout(function(){
            if(_spotifyController){
              _spotifyController.seek(_previewStartPos*1000);
              setTimeout(function(){
                if(_spotifyController) _spotifyController.togglePlay();
                _looping=false;
              },400);
            } else { _looping=false; }
          },300);
        }
      }
    });
  });
}

function _updateLyricHighlight(pos){
  _currentPos=pos;
  if(_previewStartPos===null&&pos>0.5) _previewStartPos=pos;
  var relPos=_previewStartPos!==null?pos-_previewStartPos:pos;
  var posEl=document.getElementById('music-pos');
  if(posEl) posEl.textContent=relPos.toFixed(1)+'s';
  var calEl=document.getElementById('cal-pos');
  if(calEl) calEl.textContent=relPos.toFixed(2)+'s';
  var song=MUSIC_DATA[S.musicSongIdx||0];
  var lyrics=song.lyrics||[];
  var activeIdx=-1;
  for(var i=lyrics.length-1;i>=0;i--){if(relPos>=lyrics[i].t+_timingOffset){activeIdx=i;break;}}
  // 유저가 클릭한 지 3초 이내엔 자동 하이라이트 억제
  if(activeIdx!==_lastLyricIdx&&Date.now()-_userLyricClick>3000) _setLyricDisplay(activeIdx);
}

function splitSentences(text){
  var parts=text.match(/[^.!?]+[.!?]+/g)||[];
  var rem=text.replace(/[^.!?]+[.!?]+/g,'').trim();
  if(rem) parts.push(rem);
  return parts.map(function(s){return s.trim();}).filter(Boolean);
}

// ── Free translation via Google Translate (unofficial, no key) ──
function translateFree(text){
  var url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q='+encodeURIComponent(text);
  return fetch(url)
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||!d[0]) throw new Error('번역 실패');
      return d[0].map(function(seg){return seg[0]||'';}).join('');
    });
}

// ── Local phrasal verb detector (only shows when found, no false positives) ──
function checkGrammarFree(text){
  var t=text.toLowerCase();
  var tips=[];
  var PHRASAL=[
    {re:/\bgive[s]?\s+up\b|giving\s+up|gave\s+up|given\s+up/,icon:'🙅',label:'give up — 포기하다',color:'#2563EB',detail:'"give up"은 포기하다, 그만두다는 구동사예요. "I have given up" = 나는 포기해버린 상태야.'},
    {re:/\btake[s]?\s+back\b|took\s+back|taken\s+back/,icon:'↩️',label:'take back — 되찾다/취소하다',color:'#7C3AED',detail:'"take back"은 물건을 되찾거나 한 말·행동을 취소할 때 써요.'},
    {re:/\bmake[s]?\s+amends|making\s+amends/,icon:'🤝',label:'make amends — 잘못을 보상하다',color:'#D97706',detail:'"make amends"는 잘못에 대해 사과하거나 보상한다는 관용 표현이에요.'},
    {re:/\bas\s+if\b|\bas\s+though\b/,icon:'🎭',label:'as if/as though — 마치 ~처럼',color:'#7C3AED',detail:'"as if"는 마치 ~인 것처럼이라는 비유·가정 표현이에요. "as if to make amends" = 마치 보상을 하려는 것처럼.'},
    {re:/\bgive[s]?\s+in\b|giving\s+in|gave\s+in/,icon:'🏳️',label:'give in — 굴복하다',color:'#DC2626',detail:'"give in"은 압박이나 요청에 마지못해 응하다는 뜻이에요.'},
    {re:/\blook[s]?\s+(up|into|for|after|out|over|back)\b/,icon:'🔍',label:'look + 전치사 — 구동사',color:'#059669',detail:'"look up"=찾다, "look for"=찾다, "look after"=돌보다, "look into"=조사하다.'},
    {re:/\bset\s+(up|off|out|back|aside)\b/,icon:'⚙️',label:'set + 전치사 — 구동사',color:'#EC4899',detail:'"set up"=설치/준비, "set off"=출발/유발, "set back"=지연, "set aside"=따로 두다.'},
    {re:/\brun[s]?\s+(out|into|away|over|through)\b/,icon:'🏃',label:'run + 전치사 — 구동사',color:'#2563EB',detail:'"run out"=다 떨어지다, "run into"=우연히 만나다, "run away"=도망가다.'},
    {re:/\bcome[s]?\s+(up|across|out|back|over|along)\b/,icon:'👋',label:'come + 전치사 — 구동사',color:'#7C3AED',detail:'"come across"=우연히 발견하다, "come back"=돌아오다, "come out"=나오다.'},
    {re:/\bbreak[s]?\s+(down|up|out|into|through)\b/,icon:'💥',label:'break + 전치사 — 구동사',color:'#D97706',detail:'"break down"=고장/무너지다, "break up"=헤어지다, "break through"=돌파하다.'},
    {re:/\bput[s]?\s+(off|up|down|aside|through)\b/,icon:'📌',label:'put + 전치사 — 구동사',color:'#0891B2',detail:'"put off"=미루다, "put up with"=참다, "put down"=내려놓다/무시하다.'},
    {re:/\bcarry\s+(on|out|over)\b/,icon:'🚀',label:'carry + 전치사 — 구동사',color:'#059669',detail:'"carry on"=계속하다, "carry out"=실행하다, "carry over"=이월하다.'},
    {re:/\bfall\s+(apart|back|behind|through)\b/,icon:'🍂',label:'fall + 전치사 — 구동사',color:'#DC2626',detail:'"fall apart"=무너지다, "fall back"=후퇴하다, "fall through"=무산되다.'},
    {re:/\bhave\s+(given|taken|made|done|been|gone|come|known|seen|said|felt|left|kept|found)\b|\bhas\s+(given|taken|made|done|been|gone|come|known)\b/,icon:'⏱️',label:'현재완료 — have/has + 과거분사',color:'#2563EB',detail:'"have/has + 과거분사"는 현재완료예요. 과거에 시작해 현재까지 이어지는 상태나 경험을 나타내요.'},
  ];
  PHRASAL.forEach(function(p){if(p.re.test(t)&&tips.length<4) tips.push({icon:p.icon,label:p.label,color:p.color,detail:p.detail});});
  return Promise.resolve(tips); // empty array = no grammar section shown
}

// ── Pollinations AI: free, no key, no account ──
function callFreeAI(text){
  var prompt='[필수 규칙: detail 필드는 반드시 한국어로만 작성. 영어 절대 금지]\n'
    +'다음 영어 텍스트에서 구동사·숙어·관용표현을 찾아 JSON만 반환해. 마크다운 없이:\n'
    +'{"grammar":[{"icon":"이모지","label":"표현명 — 한국어뜻","color":"#hex","detail":"한국어로만 설명. 이 문장에서 어떻게 쓰였는지."}]}\n'
    +'예시 형식: {"icon":"🔧","label":"bring back — 되돌리다","color":"#2563EB","detail":"\'bring back\'은 무언가를 이전 상태로 되돌린다는 구동사예요. 예: bring it back into Photoshop = 포토샵으로 다시 가져오다."}\n'
    +'규칙: 실제로 텍스트에 있는 표현만. 구동사/숙어/관용구 우선. 최대 4개.\n'
    +'금지: 소유격·진행형·be동사 같은 기초 문법, detail에 영어 문장.\n'
    +'color: #2563EB, #7C3AED, #059669, #D97706, #DC2626, #0891B2 중 하나.\n\n'
    +'영어 텍스트:\n'+text;
  return fetch('https://text.pollinations.ai/',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:[{role:'user',content:prompt}],model:'openai',seed:42,jsonMode:true})
  })
  .then(function(r){if(!r.ok) return checkGrammarFree(text);return r.text();})
  .then(function(t){
    var m=t.match(/\{[\s\S]*\}/);
    if(!m) return [];
    var d=JSON.parse(m[0]);
    return d.grammar||[];
  })
  .catch(function(){return checkGrammarFree(text);});
}

  var prompt='한국인 영어 학습자를 위해 아래 영어 문장의 발음·강세·리듬·연음을 코칭해줘.\n'
    +'JSON만 반환, 마크다운 없이:\n'
    +'{"pronunciation":[{"icon":"이모지","label":"코칭 제목","color":"#hex","detail":"한국어 설명 (구체적 예시 포함)"}]}\n'
    +'코칭 기준 (가장 중요한 것 최대 3개):\n'
    +'① 문장 강세: 어떤 단어가 강하게/약하게? 실제 발화 예시와 함께\n'
    +'② 연음·리듬: "pick_it_up"처럼 이어 발음하는 부분, 축약형 (gonna/wanna/hafta 등)\n'
    +'③ 어색한 표현: 더 자연스러운 네이티브 대안이 있으면 제시\n'
    +'해당 없는 항목은 생략. color: #7C3AED(강세), #059669(연음), #D97706(표현) 중 선택.\n\n'
    +'영어 문장:\n'+text;
  return fetch('https://text.pollinations.ai/',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:[{role:'user',content:prompt}],model:'openai',seed:77,jsonMode:true})
  })
  .then(function(r){if(!r.ok) return [];return r.text();})
  .then(function(t){
    var m=t.match(/\{[\s\S]*\}/);
    if(!m) return [];
    var d=JSON.parse(m[0]);
    return Array.isArray(d.pronunciation)?d.pronunciation:[];
  })
  .catch(function(){return [];});
}

function runAIAnalysis(txt){
  txt=(txt||'').trim();
  if(!txt) return;
  set({aiLoading:true,aiEng:txt,aiInput:txt,aiKor:'',aiGrammar:[],aiPron:[],aiError:''});

  var allWords=txt.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/)
    .map(function(w){return w.replace(/[^a-z]/g,'');})
    .filter(function(w,i,arr){return w.length>1&&arr.indexOf(w)===i;});

  var analysisPromise=Promise.all([translateFree(txt),callFreeAI(txt),callPronCoach(txt)])
    .then(function(r){return {translation:r[0],grammar:r[1],pron:r[2]};});

  Promise.all([analysisPromise,fetchPhonForWords(allWords)])
    .then(function(results){
      var d=results[0];
      set({aiLoading:false,aiKor:d.translation||'',aiGrammar:d.grammar||[],aiPron:d.pron||[]});
    })
    .catch(function(){set({aiLoading:false,aiError:'오류. 네트워크를 확인해주세요.'});});
}

function ocrImage(input){
  var file=input.files[0];
  if(!file) return;
  if(!window.Tesseract){
    set({aiError:'OCR 라이브러리 로딩 중이에요. 잠시 후 다시 시도해주세요.'});
    return;
  }
  set({aiImgLoading:true,aiError:''});
  Tesseract.recognize(file,'eng',{logger:function(){}})
    .then(function(result){
      var txt=(result.data.text||'').trim().replace(/\r?\n+/g,' ').replace(/\s+/g,' ');
      if(!txt){set({aiImgLoading:false,aiError:'텍스트를 찾을 수 없어요. 더 선명한 사진을 사용해보세요.'});return;}
      var el=document.getElementById('aiInputField');
      if(el) el.value=txt;
      set({aiImgLoading:false,aiInput:txt});
    })
    .catch(function(){set({aiImgLoading:false,aiError:'이미지 분석 실패. 텍스트를 직접 입력해보세요.'});});
}

      +'<button onclick="prevS()" '+(S.idx===0?'disabled':'')+' style="flex:1;padding:11px;background:#f5f5f5;border:none;border-radius:13px;font-size:13px;font-weight:700;color:'+(S.idx===0?'#ccc':'#1a1a1a')+';cursor:'+(S.idx===0?'not-allowed':'pointer')+'">← 이전</button>'

      +'</div></div>';
  }
}

// Preload voices for iOS Safari
if(window.speechSynthesis){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged=function(){speechSynthesis.getVoices();};
}
render();
</script>
</body>
</html>
